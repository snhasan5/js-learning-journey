<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <title>Ajax Tutorial</title>
  </head>
  <body>
    <h1>Ajax Tutorial</h1>
<button type="button" id="fetchBtn" class="btn btn-primary">Fetch Data</button>
<button type="button" id="backuoBtn" class="btn btn-secondary">Backup Button</button>


    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script>
        console.log("Ajax tutorial one-shot");
        let fetchBtn = document.getElementById('fetchBtn');
        fetchBtn.addEventListener('click', buttonClickHandler);
        
        
        function buttonClickHandler(){
            console.log('I was clicked');
            const xhr = new XMLHttpRequest(); // create an object
            //open the object
            xhr.open('GET','./hasan.txt', true); //true because i need asynchronous

            //what to do on progress tracking
            xhr.onprogress = function(){
                console.log('On Progress with ready state' , xhr.readyState);
            }

            
            //what to do when response is ready
            xhr.onload = function(){
                if(this.status == 200) console.log(this.responseText);
                else{
                    console.error("Some error occured")
                }
            }
            xhr.onreadystatechange = function(){
                console.log('ready state is now ',xhr.readyState);
            }
            //send the request 
            xhr.send();
        }
    </script>
</body>
</html>
